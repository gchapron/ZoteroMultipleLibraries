<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml"
      id="zml-prefs-root">

	<!-- Libraries: pick one, create one, or turn a group library into one -->
	<groupbox>
		<label><html:h2 data-l10n-id="zml-prefs-libraries-heading"/></label>
		<hbox align="center">
			<label data-l10n-id="zml-prefs-library-label" control="zml-library"/>
			<menulist id="zml-library" native="true" style="flex: 1">
				<menupopup/>
			</menulist>
			<button id="zml-new" data-l10n-id="zml-prefs-new-button"/>
			<button id="zml-rename" data-l10n-id="zml-prefs-rename-button"/>
			<button id="zml-delete" data-l10n-id="zml-prefs-delete-button"/>
		</hbox>
		<description id="zml-no-libraries" class="zml-hint" data-l10n-id="zml-prefs-no-libraries" hidden="true"/>
		<description class="zml-hint" data-l10n-id="zml-prefs-new-explanation"/>
		<vbox id="zml-adopt-box">
			<hbox align="center">
				<label data-l10n-id="zml-prefs-adopt-label" control="zml-adopt-select"/>
				<menulist id="zml-adopt-select" native="true" style="flex: 1">
					<menupopup/>
				</menulist>
				<button id="zml-adopt" data-l10n-id="zml-prefs-adopt-button"/>
			</hbox>
			<description class="zml-hint" data-l10n-id="zml-prefs-adopt-explanation"/>
		</vbox>
	</groupbox>

	<!-- Syncing of the selected library -->
	<groupbox id="zml-sync-box">
		<label><html:h2 id="zml-sync-heading"/></label>
		<description id="zml-sync-status"/>

		<vbox id="zml-link-box">
			<description data-l10n-id="zml-prefs-link-explanation"/>
			<vbox class="zml-steps">
				<hbox align="center">
					<label class="zml-step" data-l10n-id="zml-prefs-step1"/>
					<button id="zml-open-groups" data-l10n-id="zml-prefs-open-groups-button"/>
				</hbox>
				<hbox align="center">
					<label class="zml-step" data-l10n-id="zml-prefs-step2"/>
					<button id="zml-sync-now" data-l10n-id="zml-prefs-sync-now-button"/>
				</hbox>
				<hbox align="center">
					<label class="zml-step" data-l10n-id="zml-prefs-step3" control="zml-group-select"/>
					<vbox id="zml-group-select-box" style="flex: 1">
						<menulist id="zml-group-select" native="true" style="flex: 1">
							<menupopup/>
						</menulist>
					</vbox>
					<description id="zml-no-group-yet" class="zml-hint" data-l10n-id="zml-prefs-no-group-yet" style="flex: 1"/>
				</hbox>
				<hbox align="center" class="zml-indent">
					<label class="zml-hint" data-l10n-id="zml-prefs-group-id-label" control="zml-group-id"/>
					<html:input id="zml-group-id" type="text" style="width: 10em"/>
				</hbox>
			</vbox>
			<hbox align="center">
				<button id="zml-link" data-l10n-id="zml-prefs-enable-sync-button"/>
			</hbox>
		</vbox>

		<vbox id="zml-linked-box">
			<checkbox id="zml-sync-enabled" data-l10n-id="zml-prefs-sync-enabled" native="true"/>
			<hbox id="zml-release-box" align="center">
				<button id="zml-release" data-l10n-id="zml-prefs-release-button"/>
				<description class="zml-hint" data-l10n-id="zml-prefs-release-explanation" style="flex: 1"/>
			</hbox>
		</vbox>
	</groupbox>

	<!-- Files of the selected library -->
	<groupbox id="zml-file-box">
		<label><html:h2 id="zml-file-heading"/></label>
		<description id="zml-file-unavailable" class="zml-hint" data-l10n-id="zml-prefs-file-sync-unavailable"/>
		<vbox id="zml-file-settings">
			<radiogroup id="zml-file-mode" orient="vertical">
				<radio value="zotero" data-l10n-id="zml-prefs-file-mode-zotero"/>
				<radio value="webdav" data-l10n-id="zml-prefs-file-mode-webdav"/>
				<radio value="none" data-l10n-id="zml-prefs-file-mode-none"/>
			</radiogroup>
			<description id="zml-zotero-note" class="zml-hint zml-indent"/>
			<vbox id="zml-webdav-box" class="zml-indent">
				<radiogroup id="zml-webdav-source" orient="vertical">
					<radio id="zml-webdav-main" value="main" data-l10n-id="zml-prefs-webdav-main"/>
					<radio value="custom" data-l10n-id="zml-prefs-webdav-custom"/>
				</radiogroup>
				<vbox id="zml-webdav-custom-box" class="zml-indent">
					<hbox align="center">
						<label data-l10n-id="zml-prefs-url-label" control="zml-url"/>
						<menulist id="zml-scheme" native="true">
							<menupopup>
								<menuitem value="https" label="https://"/>
								<menuitem value="http" label="http://"/>
							</menupopup>
						</menulist>
						<html:input id="zml-url" type="text" style="flex: 1"/>
					</hbox>
					<hbox align="center">
						<label data-l10n-id="zml-prefs-username-label" control="zml-username"/>
						<html:input id="zml-username" type="text" style="flex: 1"/>
					</hbox>
					<hbox align="center">
						<label data-l10n-id="zml-prefs-password-label" control="zml-password"/>
						<html:input id="zml-password" type="password" style="flex: 1"/>
					</hbox>
				</vbox>
				<description id="zml-webdav-folder" class="zml-hint"/>
				<hbox align="center">
					<button id="zml-verify" data-l10n-id="zml-prefs-verify-button"/>
					<description id="zml-verify-status"/>
				</hbox>
			</vbox>
		</vbox>
	</groupbox>
</vbox>
